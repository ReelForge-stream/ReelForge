# AMD Radeon (VA-API): the render node, plus the host's render/video groups so a non-root container can open it.
services:
  reelforge:
    environment:
      RF_GPU: amd
      RF_RENDER_DEVICE: ${HOST_RENDER_DEVICE}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${HOST_RENDER_GID}"
      - "${HOST_VIDEO_GID}"
