# NVIDIA: needs the NVIDIA driver and the NVIDIA Container Toolkit on the host.
services:
  reelforge:
    environment:
      RF_GPU: nvidia
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
