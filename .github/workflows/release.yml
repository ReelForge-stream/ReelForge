name: Release

# Publish a release either way:
#   - GitHub → Actions → Release → "Run workflow", enter a version like 0.2.0, or
#   - push a tag: git tag v0.2.0 && git push origin v0.2.0
# Either way you get:
#   1. ReelForge_0.2.0.0.zip  - the module; servers auto-update from the feed below
#   2. ReelForge-Setup-0.2.0.exe - the all-in-one Windows installer
#   3. ReelForge-AndroidTV-0.2.0.apk - the Google TV / Android TV app (sideload; it updates itself)
#   4. the update feed (branch "update-feed", manifest.json)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (creates tag v0.2.0 on main)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  JELLYFIN_VERSION: '12.2'
  TARGET_ABI: '12.2.0.0'

jobs:
  module:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          V="${TAG#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.2.3 (got '$V')"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Test
        working-directory: server
        run: dotnet test ReelForge.Tests -c Release
      - name: Build module
        working-directory: server
        run: |
          V=${{ steps.v.outputs.version }}
          dotnet build ReelForge -c Release -p:Version=$V -p:AssemblyVersion=$V.0 -p:FileVersion=$V.0
      - name: Package module
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p out/pkg
          cp server/ReelForge/bin/Release/net10.0/ReelForge.dll out/pkg/
          cat > out/pkg/meta.json <<JSON
          {"category":"General","guid":"6f1d0c52-8a3e-4c1b-9b7e-3d5a2e9f4c71","name":"ReelForge","description":"New interface plus Media Manager","overview":"ReelForge","owner":"ReelForge","targetAbi":"${TARGET_ABI}","version":"${V}.0","timestamp":"$(date -u +%FT%TZ)","changelog":"","status":"Active","autoUpdate":true,"assemblies":["ReelForge.dll"]}
          JSON
          (cd out/pkg && zip -q ../ReelForge_${V}.0.zip ReelForge.dll meta.json)
          md5sum out/ReelForge_${V}.0.zip | cut -d' ' -f1 > out/checksum.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ReelForge ${{ steps.v.outputs.version }}
          files: out/ReelForge_${{ steps.v.outputs.version }}.0.zip
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: out/checksum.txt

  installer:
    needs: module
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version ${{ needs.module.outputs.version }} -JellyfinVersion $env:JELLYFIN_VERSION -SkipTests
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: packaging/windows/dist/ReelForge-Setup-${{ needs.module.outputs.version }}.exe

  android-tv:
    # Signed with the same key every release (repo secrets), so the TV app can update in place.
    needs: module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.RF_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repo secret RF_ANDROID_KEYSTORE_B64 is missing. See tv/android/README.md (Signing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/reelforge.keystore"
          echo "RF_KEYSTORE_PATH=$RUNNER_TEMP/reelforge.keystore" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          RELEASE_VERSION: ${{ needs.module.outputs.version }}
          RF_KEYSTORE_PASSWORD: ${{ secrets.RF_ANDROID_KEYSTORE_PASSWORD }}
          RF_KEY_ALIAS: ${{ secrets.RF_ANDROID_KEY_ALIAS }}
          RF_KEY_PASSWORD: ${{ secrets.RF_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ReelForge-AndroidTV-${RELEASE_VERSION}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: tv/android/ReelForge-AndroidTV-${{ needs.module.outputs.version }}.apk

  update-feed:
    # Publish to the feed only after both downloads exist.
    needs: [module, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: checksum
      - name: Check out the update-feed branch (created on first release)
        run: |
          git clone --branch update-feed --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed \
            || (git init -b update-feed feed && git -C feed remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - name: Add this release to manifest.json
        run: |
          V=${{ needs.module.outputs.version }}
          python3 src/scripts/update-manifest.py feed/manifest.json \
            --version "$V" --target-abi "$TARGET_ABI" \
            --source-url "https://github.com/${{ github.repository }}/releases/download/${TAG}/ReelForge_${V}.0.zip" \
            --checksum "$(cat checksum.txt)" \
            --changelog "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
      - name: Publish the feed
        working-directory: feed
        run: |
          git config user.name "reelforge-release"
          git config user.email "release@reelforge.stream"
          git add manifest.json
          git commit -m "Update feed: ${TAG}"
          git push origin update-feed
