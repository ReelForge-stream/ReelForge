name: Release

# Push a tag like v0.2.0 to publish:
#   1. ReelForge_0.2.0.0.zip  - the module; servers auto-update from the feed below
#   2. ReelForge-Setup-0.2.0.exe - the all-in-one Windows installer
#   3. the update feed (branch "update-feed", manifest.json)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  JELLYFIN_VERSION: '12.2'
  TARGET_ABI: '12.2.0.0'

jobs:
  module:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Test
        working-directory: server
        run: dotnet test ReelForge.Tests -c Release
      - name: Build module
        working-directory: server
        run: |
          V=${{ steps.v.outputs.version }}
          dotnet build ReelForge -c Release -p:Version=$V -p:AssemblyVersion=$V.0 -p:FileVersion=$V.0
      - name: Package module
        run: |
          V=${{ steps.v.outputs.version }}
          mkdir -p out/pkg
          cp server/ReelForge/bin/Release/net10.0/ReelForge.dll out/pkg/
          cat > out/pkg/meta.json <<JSON
          {"category":"General","guid":"6f1d0c52-8a3e-4c1b-9b7e-3d5a2e9f4c71","name":"ReelForge","description":"New interface plus Media Manager","overview":"ReelForge","owner":"ReelForge","targetAbi":"${TARGET_ABI}","version":"${V}.0","timestamp":"$(date -u +%FT%TZ)","changelog":"","status":"Active","autoUpdate":true,"assemblies":["ReelForge.dll"]}
          JSON
          (cd out/pkg && zip -q ../ReelForge_${V}.0.zip ReelForge.dll meta.json)
          md5sum out/ReelForge_${V}.0.zip | cut -d' ' -f1 > out/checksum.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/ReelForge_${{ steps.v.outputs.version }}.0.zip
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: out/checksum.txt

  installer:
    needs: module
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version ${{ needs.module.outputs.version }} -JellyfinVersion $env:JELLYFIN_VERSION -SkipTests
      - uses: softprops/action-gh-release@v2
        with:
          files: packaging/windows/dist/ReelForge-Setup-${{ needs.module.outputs.version }}.exe

  update-feed:
    # Publish to the feed only after both downloads exist.
    needs: [module, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: checksum
      - name: Check out the update-feed branch (created on first release)
        run: |
          git clone --branch update-feed --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed \
            || (git init -b update-feed feed && git -C feed remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - name: Add this release to manifest.json
        run: |
          V=${{ needs.module.outputs.version }}
          python3 src/scripts/update-manifest.py feed/manifest.json \
            --version "$V" --target-abi "$TARGET_ABI" \
            --source-url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/ReelForge_${V}.0.zip" \
            --checksum "$(cat checksum.txt)" \
            --changelog "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
      - name: Publish the feed
        working-directory: feed
        run: |
          git config user.name "reelforge-release"
          git config user.email "release@reelforge.stream"
          git add manifest.json
          git commit -m "Update feed: ${GITHUB_REF_NAME}"
          git push origin update-feed
