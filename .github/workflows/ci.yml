name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install ffmpeg (integration tests run real conversions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Test
        working-directory: server
        run: dotnet test ReelForge.Tests -c Release
      - name: Build module
        working-directory: server
        run: dotnet build ReelForge -c Release
      - name: Build agent (Windows)
        working-directory: server
        run: dotnet publish ReelForge.Agent -c Release -r win-x64 -o ../out/agent

  android-tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the Google TV app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
