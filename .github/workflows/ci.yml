name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install ffmpeg (integration tests run real conversions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Test
        working-directory: server
        run: dotnet test ReelForge.Tests -c Release
      - name: Build module
        working-directory: server
        run: dotnet build ReelForge -c Release
      - name: Build agent (Windows)
        working-directory: server
        run: dotnet publish ReelForge.Agent -c Release -r win-x64 -o ../out/agent

  android-tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the Google TV app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  roku:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv/roku
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv/roku/package-lock.json
      - name: Check for leftover Jellyfin branding
        run: scripts/check-branding.sh
      - name: Compile and package the Roku app
        run: npm ci --no-audit --no-fund && npm run build && unzip -l out/roku.zip | grep -q "^.* manifest$"

  docker:
    # Builds the Linux/NAS image from source (not pushed) and checks the HardyOS package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: RF_VERSION=0.0.1
          push: false
          load: true
          tags: reelforge:ci
      - name: Start the image and check ReelForge loads
        run: |
          docker run -d --name rf -p 8096:8096 reelforge:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8096/health >/dev/null 2>&1 && break; sleep 3; done
          for i in $(seq 1 20); do code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8096/reelforge/); [ "$code" = 200 ] && break; sleep 3; done
          docker logs rf 2>&1 | grep -E "Loaded plugin: ReelForge"
          test "$code" = 200
      - name: Check the HardyOS package
        run: |
          pip install --quiet jsonschema
          python3 scripts/hardyapp.py validate packaging/hardyos/reelforge
          python3 scripts/hardyapp.py pack packaging/hardyos/reelforge --version 0.0.1 -o /tmp/ReelForge-0.0.1.hardyapp
